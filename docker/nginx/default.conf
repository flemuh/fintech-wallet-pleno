# index.html sempre revalidado: depois de um deploy o navegador busca a versão nova.
# Os arquivos de /assets têm hash no nome, então podem ficar em cache por um ano.
# A API não recebe esse cabeçalho, porque o Laravel já define o dela.
map $uri $controle_de_cache {
    ~^/api(/|$)  "";
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Cache-Control $controle_de_cache always;

    # SPA: qualquer rota do Vue Router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Só a API vai para o Laravel; o resto é o Vue
    location ~ ^/api(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;
    }

    location ~ /\. {
        deny all;
    }
}
