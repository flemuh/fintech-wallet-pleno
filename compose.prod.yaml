name: fintech-wallet
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    mem_limit: 384m
    cpus: 1.0
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.prod
    mem_limit: 384m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4176:80"

volumes:
  db-data: