name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Permissão mínima: o CI só precisa ler o código.
permissions:
  contents: read

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wallet
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: wallet
      DB_USERNAME: wallet
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Auditoria de segurança das dependências
        run: composer audit

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Testes
        run: php artisan test --log-junit junit.xml

      - name: Resumo dos testes
        if: always()
        run: |
          php -r '$s = simplexml_load_file("junit.xml")->testsuite;
          printf("## PHPUnit\n\n- Testes: %d\n- Asserções: %d\n- Falhas: %d\n- Erros: %d\n- Tempo: %.1fs\n",
            $s["tests"], $s["assertions"], $s["failures"], $s["errors"], $s["time"]);' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

      - name: Auditoria de segurança (somente produção)
        run: npm audit --omit=dev

      - name: Lint, tipos, testes e build
        run: npm run check

  deploy:
    name: Deploy na VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave no servidor só executa o deploy.sh, por isso não passamos comando
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -p 2222 deploy@"$SSH_HOST"