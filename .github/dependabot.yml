# Dependabot: um PR por mês para cada ecossistema, com todas as atualizações juntas.
# Correções de segurança continuam chegando na hora. Os PRs vão para a dev.
version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    target-branch: dev
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      todas:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      todas:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      todas:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/docker/php, /docker/nginx]
    target-branch: dev
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      todas:
        patterns: ['*']
