# Dependabot: abre PRs semanais com atualizações das dependências e, a qualquer momento,
# quando sai correção de segurança. Os PRs vão para a dev, como todo o resto do trabalho.
version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      # Atualizações menores juntas num PR só; versões major continuam em PRs separados
      menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories: [/docker/php, /docker/nginx]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
